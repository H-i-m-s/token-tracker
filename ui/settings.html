<!DOCTYPE html>
<html lang="zh-CN" class="tts-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="token-tracker-app-role" content="settings">
<title>Token 用量 · 设置</title>
<link rel="stylesheet" href="./token-tracker.css">
<!-- 悬停提示的浮层：它挂在 body 上，四个页面共用，所以单独一份。
     必须在 token-tracker.css 之后：颜色变量来自那一份。 -->
<link rel="stylesheet" href="./hover-tip.css">
<!-- 设置页自己的那一层：卡片、字段行、吸底操作条。必须排在 token-tracker.css 之后，
     它靠后来居上盖掉 .tt-select / .tt-btn 里几处菜单尺度的取值。 -->
<link rel="stylesheet" href="./settings.css">
<!-- 模型价格卡自己的那一层：它靠行高压密度，与设置页通用字段行不同一套尺度，
     所以单独放一个文件，不把设置页那张通用表越改越长。 -->
<link rel="stylesheet" href="./settings-price.css">
</head>
<body class="tts-body">
<div id="app-root"></div>
<script type="module">
  import { bootSettings } from "./settings.mjs";
  bootSettings({ slot: "settings" }).catch((err) => {
    console.error("[token-tracker-app] settings boot failed:", err);
    document.body.innerHTML = `<div style="padding:24px;color:var(--tt-red,#d64545)">设置页启动失败：${String(err.message || err).replace(/</g, "&lt;")}</div>`;
  });
</script>
</body>
</html>
